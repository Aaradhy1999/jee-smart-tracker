<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Smart Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-dashboard">
        
        <header class="dashboard-header">
            <h1>JEE 2029 Smart Progress Engine</h1>
            <div class="global-stats">
                <span>Total Study: <strong id="total-hours">0</strong> hrs</span>
                <span>Syllabus Mastered: <strong id="global-percent">0%</strong></span>
            </div>
        </header>

        <main class="dashboard-body">
            
            <section class="panel sidebar-explorer">
                <h3>Syllabus Explorer</h3>
                <div class="subject-selectors">
                    <button class="sub-btn active" data-subject="physics">Physics Matrix</button>
                    <button class="sub-btn" data-subject="chemistry">Chemistry Matrix</button>
                    <button class="sub-btn" data-subject="math">Math Matrix</button>
                </div>
                <div id="chapter-list-tree" class="list-tree">
                    </div>
            </section>

        </main>

    </div>
    <script src="app.js"></script>
</body>
</html>
